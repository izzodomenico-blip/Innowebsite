# Deploy su Netlify — Next.js 16 (App Router).
# Il runtime Next di Netlify viene rilevato e installato automaticamente; questo
# file rende esplicito il comando di build e il plugin ufficiale.
[build]
  command = "npm run build"

# Next.js 16 richiede Node >= 20.9 (vedi engines di "next"). Pinniamo Node 20
# per evitare build fallite con il default più vecchio di Netlify.
[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
